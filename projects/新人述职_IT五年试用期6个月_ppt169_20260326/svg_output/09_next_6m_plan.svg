ize="17" font-weight="400" fill="#5D6D7E"><tspan x="658" dy="0">在需求分析、文档整理、代码辅助中实践 AI 方法</tspan><tspan x="658" dy="26">提升信息组织和研发效率</tspan></text><rect x="928" y="210" width="294" height="242" rx="14" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.2"/><rect x="928" y="210" width="294" height="8" rx="4" fill="#B9D99E"/><text x="948" y="248" text-anchor="start" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#B9D99E">沉淀 04</text><text x="948" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#2C3E50"><tspan x="948" dy="0">团队价值</tspan></text><text x="948" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#5D6D7E"><tspan x="948" dy="0">把个人经验沉淀成团队可复用资产</tspan><tspan x="948" dy="26">降低 onboarding 和交接成本</tspan></text><rect x="58" y="486" width="1164" height="82" rx="16" fill="#F6FBE8"/><text x="86" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#6B8E00"><tspan x="86" dy="0">在项目交付之外，主动补位团队机制与知识沉淀，让经验可以复制、方法可以复用。</tspan></text>
