pan x="948" dy="0">更高要求</tspan></text><text x="948" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="948" dy="0">把一次性交付沉淀成可复用能力</tspan><tspan x="948" dy="28">成为可放心托付复杂事项的人</tspan></text><rect x="58" y="372" width="1144" height="154" rx="12" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><text x="84" y="410" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#6B8E00"><tspan x="84" dy="0">试用期工作目标</tspan></text><circle cx="88" cy="443" r="5" fill="#88C100"/><text x="106" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#333F50"><tspan x="106" dy="0">尽快熟悉业务，缩短从理解需求到给出方案的时间</tspan></text><circle cx="88" cy="485" r="5" fill="#88C100"/><text x="106" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#333F50"><tspan x="106" dy="0">在关键项目中承担更大责任，兼顾进度、质量与协同效率</tspan></text><circle cx="88" cy="527" r="5" fill="#88C100"/><text x="106" y="534" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#333F50"><tspan x="106" dy="0">把单次交付沉淀为 SOP、配置化能力和团队经验资产</tspan></text><rect x="56" y="556" width="1168" height="34" rx="8" fill="#F6FBE8" stroke="#CFE1A8" stroke-width="1"/><rect x="56" y="556" width="6" height="34" rx="3" fill="#88C100"/><text x="76" y="579" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#4F5B66"><tspan x="76" dy="0">试用期的核心不是做了多少事，而是能否让团队更放心地把复杂事项交给我。</tspan></text>
