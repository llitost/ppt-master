ize="28" font-weight="700" fill="#333F50"><tspan x="784" dy="0">项目负责人 + 核心研发</tspan></text><rect x="58" y="324" width="270" height="192" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="58" y="324" width="270" height="8" rx="4" fill="#88C100"/><text x="78" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="78" dy="0">Situation</tspan></text><text x="78" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="78" dy="0">时间紧、范围大、协同复杂</tspan><tspan x="78" dy="28">活动分 4 期推进</tspan><tspan x="78" dy="28">需要兼顾拉新、活跃、转化目标</tspan></text><rect x="346" y="324" width="270" height="192" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="346" y="324" width="270" height="8" rx="4" fill="#88C100"/><text x="366" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="366" dy="0">Task</tspan></text><text x="366" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="366" dy="0">拆解发布节奏</tspan><tspan x="366" dy="28">协调前后端与业务方</tspan><tspan x="366" dy="28">承担关键模块研发与风险兜底</tspan></text><rect x="634" y="324" width="270" height="192" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="634" y="324" width="270" height="8" rx="4" fill="#88C100"/><text x="654" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="654" dy="0">Action</tspan></text><text x="654" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="654" dy="0">识别核心链路和里程碑</tspan><tspan x="654" dy="28">按期推进联调、提测、上线</tspan><tspan x="654" dy="28">保障每一期可控交付</tspan></text><rect x="922" y="324" width="280" height="192" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="922" y="324" width="280" height="8" rx="4" fill="#88C100"/><text x="942" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="942" dy="0">Result</tspan></text><text x="942" y="396" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="942" dy="0">12.23 完成第四期发布</tspan><tspan x="942" dy="28">在高压项目中稳定交付</tspan><tspan x="942" dy="28">兼顾节奏统筹与研发质量</tspan></text><rect x="56" y="556" width="1168" height="34" rx="8" fill="#F6FBE8" stroke="#CFE1A8" stroke-width="1"/><rect x="56" y="556" width="6" height="34" rx="3" fill="#88C100"/><text x="76" y="579" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#4F5B66"><tspan x="76" dy="0">最终按计划完成四期节日活动落地，证明自己不仅能写代码，也能在高压项目中扛结果。</tspan></text>
