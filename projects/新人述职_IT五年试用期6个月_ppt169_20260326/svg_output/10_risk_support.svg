    <rect x="58" y="218" width="1144" height="96" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.2"/><rect x="58" y="218" width="12" height="96" rx="6" fill="#88C100"/><text x="92" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#333F50"><tspan x="92" dy="0">结果量化不足</tspan></text><text x="390" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="390" dy="0">提前定义效果指标</tspan></text><text x="650" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#5D6D7E"><tspan x="650" dy="0">在项目开始阶段就同步效果口径，避免复盘时只有过程没有结果。</tspan></text><rect x="58" y="330" width="1144" height="96" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.2"/><rect x="58" y="330" width="12" height="96" rx="6" fill="#88C100"/><text x="92" y="364" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#333F50"><tspan x="92" dy="0">业务纵深不足</tspan></text><text x="390" y="364" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="390" dy="0">系统梳理会员与营销链路</tspan></text><text x="650" y="364" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#5D6D7E"><tspan x="650" dy="0">不只完成模块交付，还进一步补足业务全链路理解。</tspan></text><rect x="58" y="442" width="1144" height="96" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.2"/><rect x="58" y="442" width="12" height="96" rx="6" fill="#88C100"/><text x="92" y="476" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#333F50"><tspan x="92" dy="0">AI 规范沉淀不足</tspan></text><text x="390" y="476" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="390" dy="0">建设项目级 context 和协作规范</tspan></text><text x="650" y="476" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#5D6D7E"><tspan x="650" dy="0">把个人实践沉淀成团队可复用的方法论和协作约束。</tspan></text><rect x="56" y="556" width="1168" height="34" rx="8" fill="#F6FBE8" stroke="#CFE1A8" stroke-width="1"/><rect x="56" y="556" width="6" height="34" rx="3" fill="#88C100"/><text x="76" y="579" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#4F5B66"><tspan x="76" dy="0">每个不足都对应明确行动，目标是把改进变成可执行的计划，而不是停留在表态。</tspan></text>
