    <text x="162" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="37" font-weight="700" fill="#333F50">关键案例三｜优化与平台化建设</text>
    <text x="1180" y="67" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#7F7F7F">关键问题突破举例</text>
  </g>
  <g>
    <rect x="40" y="102" width="1200" height="52" rx="6" fill="#F6FBE8" stroke="#92D050" stroke-width="1.2"/>
    <rect x="40" y="102" width="6" height="52" rx="3" fill="#88C100"/>
    <text x="62" y="133" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B8E00">KEY MESSAGE</text>
    <text x="186" y="133" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#5D6D7E">不只完成需求，更持续把一次性交付升级成可复用能力。</text>
  </g>
  <g>
    <rect x="40" y="176" width="1200" height="430" rx="8" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.5"/>
    <rect x="58" y="208" width="356" height="272" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="58" y="208" width="356" height="8" rx="4" fill="#88C100"/><text x="78" y="242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="78" dy="0">CRM 查询优化</tspan></text><text x="78" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="78" dy="0">问题：后台查询接口响应慢</tspan><tspan x="78" dy="28">动作：定位瓶颈并重构查询链路</tspan><tspan x="78" dy="28">结果：平均耗时 8s → 500ms</tspan><tspan x="78" dy="28">价值：显著提升运营侧使用效率</tspan></text><rect x="462" y="208" width="356" height="272" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="462" y="208" width="356" height="8" rx="4" fill="#88C100"/><text x="482" y="242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="482" dy="0">签到重构</tspan></text><text x="482" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="482" dy="0">问题：活动需求重复开发</tspan><tspan x="482" dy="28">动作：抽象为标准配置化能力</tspan><tspan x="482" dy="28">结果：后端无需每次重复开发</tspan><tspan x="482" dy="28">价值：提升需求响应效率和稳定性</tspan></text><rect x="866" y="208" width="336" height="272" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="866" y="208" width="336" height="8" rx="4" fill="#88C100"/><text x="886" y="242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="886" dy="0">转盘配置化</tspan></text><text x="886" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="886" dy="0">问题：33 个子类问题散落在实现中</tspan><tspan x="886" dy="28">动作：收敛到配置组合</tspan><tspan x="886" dy="28">结果：新增活动由 1 天降到约 2h</tspan><tspan x="886" dy="28">价值：持续降低重复研发成本</tspan></text><rect x="56" y="556" width="1168" height="34" rx="8" fill="#F6FBE8" stroke="#CFE1A8" stroke-width="1"/><rect x="56" y="556" width="6" height="34" rx="3" fill="#88C100"/><text x="76" y="579" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#4F5B66"><tspan x="76" dy="0">通过性能优化、架构重构和配置化设计，把一次性交付持续升级为可复用能力。</tspan></text>
  </g>
