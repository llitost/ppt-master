0" fill="#2C3E50"><tspan x="886" dy="0">转盘配置化</tspan></text><text x="886" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#5D6D7E"><tspan x="886" dy="0">问题：33 个子类散落在实现中</tspan><tspan x="886" dy="26">动作：收敛为配置组合</tspan><tspan x="886" dy="26">结果：新增活动 1 天 → 2h</tspan><tspan x="886" dy="26">价值：持续降低重复研发成本</tspan></text><rect x="58" y="540" width="1144" height="44" rx="12" fill="#6B8E00" fill-opacity="0.06"/><text x="80" y="568" text-anchor="start" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00">通过性能优化、架构重构和配置化设计，把一次性交付持续升级为可复用能力。</text>
