    <rect x="1140" y="654" width="82" height="30" rx="4" fill="#88C100"/>
    <text x="1181" y="675" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">07</text>
