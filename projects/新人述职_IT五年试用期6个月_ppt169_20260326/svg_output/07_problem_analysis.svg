    <text x="1114" y="48" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#88C100">RECRUIT</text>
  </g>
  <g>
    <text x="105" y="67" font-family="Microsoft YaHei, Arial, sans-serif" font-size="37" font-weight="400" fill="#333F50">五、</text>
    <text x="162" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="37" font-weight="700" fill="#333F50">关键案例二｜规则引擎从0到1独立建设</text>
    <text x="1180" y="67" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#7F7F7F">关键问题突破举例</text>
  </g>
  <g>
    <rect x="40" y="102" width="1200" height="52" rx="6" fill="#F6FBE8" stroke="#92D050" stroke-width="1.2"/>
    <rect x="40" y="102" width="6" height="52" rx="3" fill="#88C100"/>
    <text x="62" y="133" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B8E00">KEY MESSAGE</text>
    <text x="186" y="133" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#5D6D7E">从原型、文档到系统实现形成完整闭环，证明独立建设复杂系统的能力。</text>
  </g>
  <g>
    <rect x="40" y="176" width="1200" height="430" rx="8" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.5"/>
    <rect x="58" y="198" width="1144" height="120" rx="12" fill="#F8FBEF" stroke="#CFE1A8" stroke-width="1.2"/><text x="86" y="238" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#333F50"><tspan x="86" dy="0">从原型、文档到系统实现形成完整闭环，证明独立建设复杂系统的能力。</tspan></text><text x="86" y="278" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="400" fill="#5D6D7E"><tspan x="86" dy="0">系统能力覆盖：调用集、规则链、规则测试执行、多环境管理。</tspan></text><rect x="58" y="340" width="254" height="172" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="58" y="340" width="254" height="8" rx="4" fill="#88C100"/><text x="78" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="78" dy="0">01 原型</tspan></text><text x="78" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="78" dy="0">自绘原型交互</tspan><tspan x="78" dy="28">在方案阶段提前明确功能边界</tspan></text><rect x="340" y="340" width="254" height="172" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="340" y="340" width="254" height="8" rx="4" fill="#88C100"/><text x="360" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="360" dy="0">02 文档</tspan></text><text x="360" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="360" dy="0">自编管理台需求文档</tspan><tspan x="360" dy="28">降低协作理解偏差</tspan></text><rect x="622" y="340" width="254" height="172" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="622" y="340" width="254" height="8" rx="4" fill="#88C100"/><text x="642" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="642" dy="0">03 实现</tspan></text><text x="642" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="642" dy="0">独立实现规则引擎系统</tspan><tspan x="642" dy="28">完成管理台与执行能力建设</tspan></text><rect x="904" y="340" width="298" height="172" rx="10" fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4"/><rect x="904" y="340" width="298" height="8" rx="4" fill="#88C100"/><text x="924" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#6B8E00"><tspan x="924" dy="0">04 价值</tspan></text><text x="924" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#333F50"><tspan x="924" dy="0">从承接需求升级为定义方案并独立落地</tspan><tspan x="924" dy="28">形成更强的抽象设计与 ownership 能力</tspan></text><rect x="56" y="556" width="1168" height="34" rx="8" fill="#F6FBE8" stroke="#CFE1A8" stroke-width="1"/><rect x="56" y="556" width="6" height="34" rx="3" fill="#88C100"/><text x="76" y="579" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#4F5B66"><tspan x="76" dy="0">从需求接收升级为问题定义、方案设计和独立交付，完成从 0 到 1 的复杂系统建设。</tspan></text>
  </g>
