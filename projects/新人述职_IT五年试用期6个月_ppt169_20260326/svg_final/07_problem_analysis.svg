 V502 A10,10 0 0 1 866,512 H632 A10,10 0 0 1 622,502 V350 A10,10 0 0 1 632,340 Z" /><path fill="#88C100" d="M626,340 H872 A4,4 0 0 1 876,344 V344 A4,4 0 0 1 872,348 H626 A4,4 0 0 1 622,344 V344 A4,4 0 0 1 626,340 Z" /><text font-weight="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#6B8E00" x="642" y="374">03 实现</text><text font-weight="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333F50" x="642" y="412">独立实现规则引擎系统</text><text font-weight="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333F50" x="642" y="440">完成管理台与执行能力建设</text><path fill="#FFFFFF" stroke="#D8E7B4" stroke-width="1.4" d="M914,340 H1192 A10,10 0 0 1 1202,350 V502 A10,10 0 0 1 1192,512 H914 A10,10 0 0 1 904,502 V350 A10,10 0 0 1 914,340 Z" /><path fill="#88C100" d="M908,340 H1198 A4,4 0 0 1 1202,344 V344 A4,4 0 0 1 1198,348 H908 A4,4 0 0 1 904,344 V344 A4,4 0 0 1 908,340 Z" /><text font-weight="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#6B8E00" x="924" y="374">04 价值</text><text font-weight="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333F50" x="924" y="412">从承接需求升级为定义方案并独立落地</text><text font-weight="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#333F50" x="924" y="440">形成更强的抽象设计与 ownership 能力</text><path fill="#F6FBE8" stroke="#CFE1A8" stroke-width="1" d="M64,556 H1216 A8,8 0 0 1 1224,564 V582 A8,8 0 0 1 1216,590 H64 A8,8 0 0 1 56,582 V564 A8,8 0 0 1 64,556 Z" /><path fill="#88C100" d="M59,556 H59 A3,3 0 0 1 62,559 V587 A3,3 0 0 1 59,590 H59 A3,3 0 0 1 56,587 V559 A3,3 0 0 1 59,556 Z" /><text font-weight="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#4F5B66" x="76" y="579">从需求接收升级为问题定义、方案设计和独立交付，完成从 0 到 1 的复杂系统建设。</text></g>
